name: CI/CD Pipeline

# Builds on branches, deploys on tags: 1.2.0 to production. Backs the database up every night.
on:
  push:
    branches: ["*"]
    tags: ["*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dockflow
        run: curl -fsSL https://raw.githubusercontent.com/Shawiizz/dockflow/main/install.sh | sh -s -- --version v4.0.0-alpha.10
      - name: Build
        run: dockflow build production
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_GITHUB_TOKEN: ${{ secrets.PRODUCTION_GITHUB_TOKEN }}
          PRODUCTION_GITHUB_USERNAME: ${{ secrets.PRODUCTION_GITHUB_USERNAME }}

  deploy:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - name: Install dockflow
        run: curl -fsSL https://raw.githubusercontent.com/Shawiizz/dockflow/main/install.sh | sh -s -- --version v4.0.0-alpha.10
      - name: Deploy
        run: dockflow deploy --wait-lock 10m
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_GITHUB_TOKEN: ${{ secrets.PRODUCTION_GITHUB_TOKEN }}
          PRODUCTION_GITHUB_USERNAME: ${{ secrets.PRODUCTION_GITHUB_USERNAME }}

  backup:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dockflow
        run: curl -fsSL https://raw.githubusercontent.com/Shawiizz/dockflow/main/install.sh | sh -s -- --version v4.0.0-alpha.10
      - name: Back up
        run: dockflow backup run production --wait-lock 10m
        env:
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_GITHUB_TOKEN: ${{ secrets.PRODUCTION_GITHUB_TOKEN }}
          PRODUCTION_GITHUB_USERNAME: ${{ secrets.PRODUCTION_GITHUB_USERNAME }}
