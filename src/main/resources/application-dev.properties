spring.application.name=mohistmc-rest-api
spring.config.import=optional:file:.env.dev[.properties]
server.port=${SERVER_PORT:8080}
api.server.url=http://localhost:${SERVER_PORT:8080}
#logging.level.root=DEBUG

############
# DATABASE #
############
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000

############
## GITHUB ##
############
github.username=${GITHUB_USERNAME:}
github.token=${GITHUB_TOKEN:}

########
## S3 ##
########
# the S3Mock of docker-compose.yml, which serves its objects without credentials
s3.endpoint=${S3_ENDPOINT:http://localhost:9090}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET:builds}
s3.path-style=${S3_PATH_STYLE:true}
s3.access-key-id=${S3_ACCESS_KEY_ID:dev}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY:dev}
s3.prefix=${S3_PREFIX:builds}
s3.public-url=${S3_PUBLIC_URL:http://localhost:9090/builds}
