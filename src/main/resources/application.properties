spring.application.name=mohistmc-rest-api
server.port=${SERVER_PORT:8080}
api.server.url=https://api.mohistmc.com

############
# DATABASE #
############
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

############
## GITHUB ##
############
github.username=${GITHUB_USERNAME}
github.token=${GITHUB_TOKEN}
github.stats-repositories=MohistMC/Mohist,MohistMC/Youer

############
## BUILDS ##
############
builds.path=/var/mohistmc/builds

########
## S3 ##
########
# Builds are stored in this bucket when it is set, and in builds.path otherwise
s3.endpoint=${S3_ENDPOINT:}
s3.region=${S3_REGION:}
s3.bucket=${S3_BUCKET:}
s3.path-style=${S3_PATH_STYLE:false}
s3.access-key-id=${S3_ACCESS_KEY_ID:}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
s3.prefix=${S3_PREFIX:builds}
# downloads are redirected to <public-url>/<key>
s3.public-url=${S3_PUBLIC_URL:}
# moves the builds still in builds.path to the bucket, and deletes each file once it is there
s3.migrate-local-builds=${S3_MIGRATE_LOCAL_BUILDS:false}
s3.delete-migrated-files=${S3_DELETE_MIGRATED_FILES:false}

#############
## SWAGGER ##
#############
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs-ui
springdoc.swagger-ui.url=/docs
springdoc.swagger-ui.disable-swagger-default-url=true

#############
## BSTATS  ##
#############
bstats.servers=6762
