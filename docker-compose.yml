services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # the builds' bucket, see application-dev.properties
  s3:
    image: adobe/s3mock:4.2.0
    container_name: s3mock
    restart: always
    environment:
      initialBuckets: builds
    ports:
      - "9090:9090"

volumes:
  postgres_data:
